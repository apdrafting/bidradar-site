name: Publish LA construction bid feed
on:
  workflow_dispatch:
# Scheduled publishing retired: production is served by apdrafting/SignalEngine
# at https://bidradaralerts.com, with its own Worker collector and cron.
# Keep manual dispatch for legacy maintenance; it requires a real BIDRADAR_CSV_URL.
permissions:
  contents: write
concurrency:
  group: bidradar-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public procurement records
        env:
          BIDRADAR_CSV_URL: ${{ vars.BIDRADAR_CSV_URL }}
        run: |
          test -n "$BIDRADAR_CSV_URL" || { echo 'Missing BIDRADAR_CSV_URL repository variable' >&2; exit 1; }
          python scripts/collect_bids.py
      - name: Commit updated public feed
        run: |
          git config user.name "bidradar-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/construction-bids.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified source-linked construction bids"
            git push
          fi
