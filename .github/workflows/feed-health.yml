name: BidRadar feed health check
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify feed and fail on stale or malformed data
        env:
          API_URL: https://bidradar-api.bidradar-alerts-help.workers.dev/opportunities?summary=3
        run: |
          python - <<'PY'
          import json,os,urllib.request,datetime
          url=os.environ['API_URL']
          req=urllib.request.Request(url,headers={'User-Agent':'BidRadar-health-check/1.0'})
          with urllib.request.urlopen(req,timeout=25) as response:
              data=json.load(response)
          count=data.get('total')
          assert isinstance(count,int) and not isinstance(count,bool) and count>=0, 'Invalid lead count'
          stamp=data.get('checkedAt')
          assert isinstance(stamp,str), 'Missing checkedAt'
          checked=datetime.datetime.fromisoformat(stamp.replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-checked.astimezone(datetime.timezone.utc)).total_seconds()
          assert -300<=age<=86400, f'Feed stale or future dated: {age:.0f}s'
          print(f'Feed responding: {count} source notices; checked {stamp}. Not all are construction bids.')
          PY
